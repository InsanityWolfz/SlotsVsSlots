# Builds the public playtest and publishes it to GitHub Pages on every push to main/master.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The SPIN CHOICES test build (user, 2026-11-06): the experiment branch, built into /spin-choices/ beside the main
      # game. Its own saves; a failure there never stops the main game's deploy. The branch's push asks for this run.
      - uses: actions/checkout@v4
        continue-on-error: true
        id: spin
        with:
          ref: claude/awesome-fermat-gmik8d
          path: spin-choices-src
      - name: Build the spin choices test build
        if: steps.spin.outcome == 'success'
        continue-on-error: true
        run: |
          cd spin-choices-src
          npm ci
          npm test
          npm run build
          mkdir -p ../dist/spin-choices
          cp -r dist/. ../dist/spin-choices/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
